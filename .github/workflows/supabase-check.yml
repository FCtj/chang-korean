# Supabase 연결 점검 (공개 키만 사용 — 비밀 키 필요 없음)
# - 테이블 7개가 만들어졌는지
# - Facebook 로그인이 켜졌는지
# Actions → "Supabase check" → Run workflow 로 언제든 다시 실행할 수 있습니다.
name: Supabase check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/config.ts', '.github/workflows/supabase-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tables and auth settings
        shell: bash
        run: |
          URL=$(grep -oE "SUPABASE_URL = '[^']*'" src/config.ts | cut -d"'" -f2)
          KEY=$(grep -oE "SUPABASE_PUBLISHABLE_KEY = '[^']*'" src/config.ts | cut -d"'" -f2)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "src/config.ts 에 주소나 공개 키가 없습니다"; exit 1; fi
          case "$KEY" in sb_secret_*) echo "비밀 키는 쓰면 안 됩니다"; exit 1;; esac
          echo "프로젝트: $URL"
          missing=0
          # 로그인 전(anon)에도 읽혀야 하는 테이블: profiles, point_events (랭킹) → 200 이어야 함
          # 나머지는 로그인한 사람만 → 로그인 전에는 "permission denied"(42501)가 정상 (테이블은 있음)
          for t in profiles point_events progress groups group_members posts reactions; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "$URL/rest/v1/$t?select=*&limit=0" -H "apikey: $KEY")
            case "$t" in profiles|point_events) public=1;; *) public=0;; esac
            if [ "$code" = "200" ]; then echo "✓ 테이블 $t"
            elif [ "$public" = "0" ] && grep -q '"42501"' body.json; then echo "✓ 테이블 $t (로그인한 사람만)"
            elif grep -q '"42501"' body.json; then echo "✗ 테이블 $t 권한 없음 → supabase/migrations/20261121160000_table_grants.sql 실행"; missing=1
            else echo "✗ 테이블 $t (HTTP $code) $(head -c 200 body.json)"; missing=1; fi
          done
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 -X POST "$URL/rest/v1/rpc/get_leaderboard" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"p_period":"month"}')
          if [ "$code" = "200" ]; then echo "✓ 랭킹 함수 get_leaderboard"; else echo "✗ 랭킹 함수 (HTTP $code) $(head -c 200 body.json)"; missing=1; fi
          echo "--- 로그인 설정 ---"
          curl -s --max-time 20 "$URL/auth/v1/settings" -H "apikey: $KEY" > auth.json
          python3 - <<'PY'
          import json
          try:
              s = json.load(open('auth.json'))
          except Exception as e:
              print('✗ 로그인 설정을 읽지 못함', e); raise SystemExit(0)
          ext = s.get('external', {})
          print(('✓' if ext.get('facebook') else '✗'), 'Facebook 로그인', 'ON' if ext.get('facebook') else 'OFF')
          print('  켜진 로그인:', ', '.join(k for k, v in ext.items() if v) or '(없음)')
          print(('✗ 새 가입 막힘 (Authentication → Sign In / Providers → Allow new users to sign up 켜기)' if s.get('disable_signup') else '✓ 새 가입 허용'))
          PY
          # Supabase 에 저장된 Facebook 앱 ID = src/config.ts 의 FACEBOOK_APP_ID 인지 (로그인 시작 주소의 client_id 로 확인)
          APP_ID=$(grep -oE "FACEBOOK_APP_ID = '[0-9]*'" src/config.ts | cut -d"'" -f2)
          LOC=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "$URL/auth/v1/authorize?provider=facebook&redirect_to=https%3A%2F%2Ffctj.github.io%2Fchang-korean%2F")
          FB_ID=$(echo "$LOC" | grep -oE 'client_id=[0-9]+' | cut -d= -f2)
          SCOPE=$(echo "$LOC" | grep -oE 'scope=[^&]+' | cut -d= -f2)
          # 로그인 뒤 돌아갈 주소: state(JWT) 안의 referrer / site_url 로 확인
          STATE=$(echo "$LOC" | grep -oE 'state=[^&]+' | cut -d= -f2)
          python3 - "$STATE" <<'PY'
          import base64, json, sys, urllib.parse
          try:
              p = urllib.parse.unquote(sys.argv[1]).split('.')[1]
              c = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
              ref, site = c.get('referrer', ''), c.get('site_url', '')
              want = 'https://fctj.github.io/chang-korean/'
              print(('✓' if ref.rstrip('/') == want.rstrip('/') else '✗'), '로그인 뒤 돌아갈 주소:', ref or '(없음)')
              print(('✓' if site.rstrip('/') == want.rstrip('/') else '✗'), 'Site URL:', site or '(없음)', '(Authentication → URL Configuration)')
          except Exception as e:
              print('  (돌아갈 주소 확인 못 함)', e)
          PY
          if [ -z "$FB_ID" ]; then echo "✗ Facebook 로그인 시작 주소를 못 받음: ${LOC:0:120}"; missing=1
          elif [ "$FB_ID" = "$APP_ID" ]; then echo "✓ Supabase 의 Facebook 앱 ID = $FB_ID (요청 권한: $SCOPE)"
          else echo "✗ Supabase 의 Facebook 앱 ID 가 $FB_ID 입니다. 새 앱 $APP_ID 의 ID·시크릿으로 바꿔 넣으세요 (Authentication → Providers → Facebook)"; missing=1; fi
          if [ "$missing" = "1" ]; then echo "→ 위 ✗ 항목을 고친 뒤 이 점검을 다시 실행하세요"; exit 1; fi
          echo "✓ 서버 준비 완료"
